<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单设备列表测试</title>
    <link rel="stylesheet" href="/css/device-list.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .test-button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        
        .test-button:hover {
            background: #0056b3;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 18px;
            color: #666;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>设备列表在线时长测试</h1>
        <p>测试设备在线时长功能是否正常工作</p>
        <button class="test-button" onclick="loadDevices()">重新加载设备</button>
        <button class="test-button" onclick="showDebugInfo()">显示调试信息</button>
    </div>
    
    <div id="loading" class="loading" style="display: none;">
        正在加载设备列表...
    </div>
    
    <div id="error" class="error" style="display: none;"></div>
    
    <div id="device-list">
        <!-- 设备列表将在这里显示 -->
    </div>
    
    <script>
        let devices = [];
        
        /**
         * 页面加载时自动加载设备
         */
        document.addEventListener('DOMContentLoaded', function() {
            console.log('页面加载完成，开始加载设备列表');
            loadDevices();
        });
        
        /**
         * 加载设备列表
         */
        async function loadDevices() {
            const loadingEl = document.getElementById('loading');
            const errorEl = document.getElementById('error');
            const deviceListEl = document.getElementById('device-list');
            
            // 显示加载状态
            loadingEl.style.display = 'block';
            errorEl.style.display = 'none';
            deviceListEl.innerHTML = '';
            
            try {
                console.log('开始获取设备列表...');
                const response = await fetch('/api/devices.php');
                console.log('API响应状态:', response.status);
                
                const data = await response.json();
                console.log('API返回数据:', data);
                
                if (data.status === 'success') {
                    devices = data.devices || [];
                    console.log(`获取到 ${devices.length} 个设备`);
                    
                    renderDevices();
                    
                    if (data.stats) {
                        console.log('统计信息:', data.stats);
                    }
                } else {
                    throw new Error(data.message || 'API返回错误状态');
                }
                
            } catch (error) {
                console.error('加载设备失败:', error);
                errorEl.textContent = `加载设备失败: ${error.message}`;
                errorEl.style.display = 'block';
            } finally {
                loadingEl.style.display = 'none';
            }
        }
        
        /**
         * 渲染设备列表
         */
        function renderDevices() {
            const deviceListEl = document.getElementById('device-list');
            
            if (devices.length === 0) {
                deviceListEl.innerHTML = '<div class="loading">没有找到设备</div>';
                return;
            }
            
            // 排序：在线设备优先，然后按首次连接时间排序
            const sortedDevices = devices.sort((a, b) => {
                const aOnline = isDeviceOnline(a);
                const bOnline = isDeviceOnline(b);
                
                if (aOnline !== bOnline) {
                    return bOnline - aOnline;
                }
                
                return new Date(b.first_seen).getTime() - new Date(a.first_seen).getTime();
            });
            
            let html = '';
            
            sortedDevices.forEach(device => {
                const isOnline = isDeviceOnline(device);
                const statusClass = isOnline ? 'online' : 'offline';
                const statusIcon = isOnline ? '🟢' : '🔴';
                const statusText = isOnline ? '在线' : '离线';
                
                // 计算在线时长
                const firstSeenTime = new Date(device.first_seen).getTime();
                const lastSeenTime = new Date(device.last_seen).getTime();
                const now = Date.now();
                
                let uptimeDisplay = '';
                if (isOnline) {
                    const totalSeconds = Math.floor((now - firstSeenTime) / 1000);
                    uptimeDisplay = `在线 ${formatDuration(totalSeconds)}`;
                } else {
                    const offlineSeconds = Math.floor((now - lastSeenTime) / 1000);
                    uptimeDisplay = `离线 ${formatDuration(offlineSeconds)}`;
                }
                
                html += `
                    <div class="device-card ${statusClass}" onclick="openDeviceDetail('${device.device_id}')" title="点击查看详情">
                        <div class="device-header">
                            <span class="device-status">${statusIcon} ${statusText}</span>
                            <span class="device-id">${device.device_id}</span>
                        </div>
                        <div class="device-info">
                            <div class="device-time">
                                <small>首次连接: ${new Date(device.first_seen).toLocaleString('zh-CN')}</small><br>
                                <small>最近活动: ${new Date(device.last_seen).toLocaleString('zh-CN')}</small><br>
                                <div class="device-uptime"><strong>⏱️ ${uptimeDisplay}</strong></div>
                            </div>
                            ${renderSystemInfo(device.system_info)}
                            <div class="device-actions" onclick="event.stopPropagation();" style="margin-top: 10px; text-align: right;">
                                <button class="detail-button" onclick="openDeviceDetail('${device.device_id}')">
                                    查看详情
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            deviceListEl.innerHTML = html;
            console.log('设备列表渲染完成');
        }
        
        /**
         * 判断设备是否在线
         */
        function isDeviceOnline(device) {
            if (device.is_online !== undefined) {
                return device.is_online === 1 || device.is_online === true;
            }
            
            const lastSeen = new Date(device.last_seen).getTime();
            const now = Date.now();
            const timeDiff = (now - lastSeen) / 1000;
            
            return timeDiff <= 120; // 2分钟内算在线
        }
        
        /**
         * 格式化时长显示
         */
        function formatDuration(seconds) {
            if (seconds < 60) {
                return `${seconds}秒`;
            } else if (seconds < 3600) {
                const minutes = Math.floor(seconds / 60);
                return `${minutes}分钟`;
            } else if (seconds < 86400) {
                const hours = Math.floor(seconds / 3600);
                const minutes = Math.floor((seconds % 3600) / 60);
                return minutes > 0 ? `${hours}小时${minutes}分钟` : `${hours}小时`;
            } else {
                const days = Math.floor(seconds / 86400);
                const hours = Math.floor((seconds % 86400) / 3600);
                return hours > 0 ? `${days}天${hours}小时` : `${days}天`;
            }
        }
        
        /**
         * 渲染系统信息
         */
        function renderSystemInfo(systemInfo) {
            if (!systemInfo) return '';
            
            try {
                const info = typeof systemInfo === 'string' ? JSON.parse(systemInfo) : systemInfo;
                let html = '<div class="system-info" style="margin-top: 8px; font-size: 12px; color: #666;">';
                
                if (info.model) {
                    html += `<div>型号: ${info.model}</div>`;
                }
                if (info.version) {
                    html += `<div>版本: ${info.version}</div>`;
                }
                if (info.internal_ip) {
                    html += `<div>内网IP: ${info.internal_ip}</div>`;
                }
                
                html += '</div>';
                return html;
            } catch (e) {
                return '';
            }
        }
        
        /**
         * 打开设备详情页面
         */
        function openDeviceDetail(deviceId) {
            console.log('打开设备详情:', deviceId);
            window.open(`/device_detail.html?device_id=${encodeURIComponent(deviceId)}`, '_blank');
        }
        
        /**
         * 显示调试信息
         */
        function showDebugInfo() {
            console.log('=== 调试信息 ===');
            console.log('设备数量:', devices.length);
            console.log('设备列表:', devices);
            
            if (devices.length > 0) {
                const device = devices[0];
                console.log('第一个设备详情:', device);
                console.log('设备在线状态:', isDeviceOnline(device));
                
                const firstSeenTime = new Date(device.first_seen).getTime();
                const now = Date.now();
                const totalSeconds = Math.floor((now - firstSeenTime) / 1000);
                console.log('计算的在线时长:', formatDuration(totalSeconds));
            }
            
            alert('调试信息已输出到控制台，请按F12查看');
        }
    </script>
</body>
</html>
