<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备列表管理 - 支持分页</title>
    <link rel="stylesheet" href="/css/device-list.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .stats-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        
        .stat-number {
            font-size: 36px;
            font-weight: bold;
            color: #007bff;
            margin: 10px 0;
        }
        
        .stat-label {
            color: #666;
            font-size: 14px;
        }
        
        .controls-panel {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin: 20px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .controls-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .controls-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .pagination-panel {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        
        .pagination-button {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .pagination-button:hover {
            background: #0056b3;
        }
        
        .pagination-button:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
        
        .pagination-info {
            color: #666;
            font-size: 14px;
            margin: 0 20px;
        }
        
        .page-size-selector {
            margin-left: 15px;
        }
        
        .page-size-selector select {
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 18px;
            color: #666;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .device-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>设备列表管理</h1>
            <p>支持分页显示所有设备，包含在线时长信息</p>
        </div>
        
        <!-- 统计面板 -->
        <div class="stats-panel">
            <div class="stat-card">
                <div class="stat-number" id="total-devices">-</div>
                <div class="stat-label">总设备数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="online-devices">-</div>
                <div class="stat-label">在线设备</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="offline-devices">-</div>
                <div class="stat-label">离线设备</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="online-percentage">-%</div>
                <div class="stat-label">在线率</div>
            </div>
        </div>
        
        <!-- 控制面板 -->
        <div class="controls-panel">
            <div class="controls-left">
                <button onclick="loadDeviceStats()" class="pagination-button">刷新统计</button>
                <button onclick="loadCurrentPage()" class="pagination-button">刷新列表</button>
                <div class="page-size-selector">
                    每页显示:
                    <select id="page-size" onchange="changePageSize()">
                        <option value="20">20</option>
                        <option value="50" selected>50</option>
                        <option value="100">100</option>
                        <option value="200">200</option>
                        <option value="500">500</option>
                    </select>
                </div>
            </div>
            <div class="controls-right">
                <span id="loading-status">就绪</span>
            </div>
        </div>
        
        <!-- 分页控制 -->
        <div class="pagination-panel" id="pagination-top">
            <button class="pagination-button" onclick="firstPage()" id="first-btn">首页</button>
            <button class="pagination-button" onclick="prevPage()" id="prev-btn">上一页</button>
            <div class="pagination-info" id="page-info">第 - 页，共 - 页</div>
            <button class="pagination-button" onclick="nextPage()" id="next-btn">下一页</button>
            <button class="pagination-button" onclick="lastPage()" id="last-btn">末页</button>
        </div>
        
        <!-- 设备列表 -->
        <div id="device-grid" class="device-grid">
            <div class="loading">正在加载设备列表...</div>
        </div>
        
        <!-- 底部分页控制 -->
        <div class="pagination-panel" id="pagination-bottom">
            <button class="pagination-button" onclick="firstPage()">首页</button>
            <button class="pagination-button" onclick="prevPage()">上一页</button>
            <div class="pagination-info" id="page-info-bottom">第 - 页，共 - 页</div>
            <button class="pagination-button" onclick="nextPage()">下一页</button>
            <button class="pagination-button" onclick="lastPage()">末页</button>
        </div>
    </div>

    <script>
        // 全局变量
        let currentPage = 1;
        let pageSize = 50;
        let totalDevices = 0;
        let totalPages = 0;
        let devices = [];
        let isLoading = false;
        
        /**
         * 页面加载完成后初始化
         */
        document.addEventListener('DOMContentLoaded', function() {
            loadDeviceStats();
            loadCurrentPage();
            
            // 每30秒自动刷新统计
            setInterval(loadDeviceStats, 30000);
        });
        
        /**
         * 加载设备统计信息
         */
        async function loadDeviceStats() {
            try {
                const response = await fetch('/api/device_stats.php');
                const data = await response.json();
                
                if (data.status === 'success') {
                    const stats = data.statistics;
                    document.getElementById('total-devices').textContent = stats.total_devices;
                    document.getElementById('online-devices').textContent = stats.online_devices;
                    document.getElementById('offline-devices').textContent = stats.offline_devices;
                    document.getElementById('online-percentage').textContent = stats.online_percentage + '%';
                    
                    // 更新总设备数用于分页计算
                    totalDevices = stats.total_devices;
                    totalPages = Math.ceil(totalDevices / pageSize);
                    updatePaginationInfo();
                }
                
            } catch (error) {
                console.error('加载设备统计失败:', error);
            }
        }
        
        /**
         * 加载当前页的设备列表
         */
        async function loadCurrentPage() {
            if (isLoading) return;
            
            isLoading = true;
            updateLoadingStatus('正在加载...');
            
            try {
                const offset = (currentPage - 1) * pageSize;
                const response = await fetch(`/api/devices.php?limit=${pageSize}&offset=${offset}`);
                const data = await response.json();
                
                if (data.status === 'success') {
                    devices = data.devices;
                    renderDevices();
                    updatePaginationButtons();
                } else {
                    throw new Error(data.message || '加载设备列表失败');
                }
                
            } catch (error) {
                console.error('加载设备列表失败:', error);
                document.getElementById('device-grid').innerHTML = 
                    `<div class="error">加载失败: ${error.message}</div>`;
            } finally {
                isLoading = false;
                updateLoadingStatus('就绪');
            }
        }
        
        /**
         * 渲染设备列表
         */
        function renderDevices() {
            const deviceGrid = document.getElementById('device-grid');
            
            if (devices.length === 0) {
                deviceGrid.innerHTML = '<div class="loading">当前页面没有设备</div>';
                return;
            }
            
            let html = '';
            
            devices.forEach(device => {
                const isOnline = isDeviceOnline(device);
                const statusClass = isOnline ? 'online' : 'offline';
                const statusIcon = isOnline ? '🟢' : '🔴';
                const statusText = isOnline ? '在线' : '离线';
                
                // 计算在线时长
                const firstSeenTime = new Date(device.first_seen).getTime();
                const lastSeenTime = new Date(device.last_seen).getTime();
                const now = Date.now();
                
                let uptimeDisplay = '';
                if (isOnline) {
                    const totalSeconds = Math.floor((now - firstSeenTime) / 1000);
                    uptimeDisplay = `在线 ${formatDuration(totalSeconds)}`;
                } else {
                    const offlineSeconds = Math.floor((now - lastSeenTime) / 1000);
                    uptimeDisplay = `离线 ${formatDuration(offlineSeconds)}`;
                }
                
                html += `
                    <div class="device-card ${statusClass}" onclick="openDeviceDetail('${device.device_id}')" title="点击查看详情">
                        <div class="device-header">
                            <span class="device-status">${statusIcon} ${statusText}</span>
                            <span class="device-id">${device.device_id}</span>
                        </div>
                        <div class="device-info">
                            <div class="device-time">
                                <small>首次连接: ${new Date(device.first_seen).toLocaleString('zh-CN')}</small><br>
                                <small>最近活动: ${new Date(device.last_seen).toLocaleString('zh-CN')}</small><br>
                                <div class="device-uptime"><strong>⏱️ ${uptimeDisplay}</strong></div>
                            </div>
                            ${renderSystemInfo(device.system_info)}
                            <div class="device-actions" onclick="event.stopPropagation();" style="margin-top: 10px; text-align: right;">
                                <button class="detail-button" onclick="openDeviceDetail('${device.device_id}')">
                                    查看详情
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            deviceGrid.innerHTML = html;
        }
        
        /**
         * 判断设备是否在线
         */
        function isDeviceOnline(device) {
            if (device.is_online !== undefined) {
                return device.is_online === 1 || device.is_online === true;
            }
            
            const lastSeen = new Date(device.last_seen).getTime();
            const now = Date.now();
            const timeDiff = (now - lastSeen) / 1000;
            
            return timeDiff <= 120;
        }
        
        /**
         * 格式化时长显示
         */
        function formatDuration(seconds) {
            if (seconds < 60) {
                return `${seconds}秒`;
            } else if (seconds < 3600) {
                const minutes = Math.floor(seconds / 60);
                return `${minutes}分钟`;
            } else if (seconds < 86400) {
                const hours = Math.floor(seconds / 3600);
                const minutes = Math.floor((seconds % 3600) / 60);
                return minutes > 0 ? `${hours}小时${minutes}分钟` : `${hours}小时`;
            } else {
                const days = Math.floor(seconds / 86400);
                const hours = Math.floor((seconds % 86400) / 3600);
                return hours > 0 ? `${days}天${hours}小时` : `${days}天`;
            }
        }
        
        /**
         * 渲染系统信息
         */
        function renderSystemInfo(systemInfo) {
            if (!systemInfo) return '';
            
            try {
                const info = typeof systemInfo === 'string' ? JSON.parse(systemInfo) : systemInfo;
                let html = '<div class="system-info" style="margin-top: 8px; font-size: 12px; color: #666;">';
                
                if (info.model) {
                    html += `<div>型号: ${info.model}</div>`;
                }
                if (info.internal_ip) {
                    html += `<div>内网IP: ${info.internal_ip}</div>`;
                }
                
                html += '</div>';
                return html;
            } catch (e) {
                return '';
            }
        }
        
        /**
         * 打开设备详情页面
         */
        function openDeviceDetail(deviceId) {
            window.open(`/device_detail.html?device_id=${encodeURIComponent(deviceId)}`, '_blank');
        }
        
        /**
         * 更新分页信息
         */
        function updatePaginationInfo() {
            const startItem = (currentPage - 1) * pageSize + 1;
            const endItem = Math.min(currentPage * pageSize, totalDevices);
            
            const infoText = `第 ${currentPage} 页，共 ${totalPages} 页 (显示 ${startItem}-${endItem}，共 ${totalDevices} 台设备)`;
            
            document.getElementById('page-info').textContent = infoText;
            document.getElementById('page-info-bottom').textContent = infoText;
        }
        
        /**
         * 更新分页按钮状态
         */
        function updatePaginationButtons() {
            const firstBtns = document.querySelectorAll('#first-btn, .pagination-panel button:first-child');
            const prevBtns = document.querySelectorAll('#prev-btn, .pagination-panel button:nth-child(2)');
            const nextBtns = document.querySelectorAll('#next-btn, .pagination-panel button:nth-child(4)');
            const lastBtns = document.querySelectorAll('#last-btn, .pagination-panel button:last-child');
            
            firstBtns.forEach(btn => btn.disabled = currentPage === 1);
            prevBtns.forEach(btn => btn.disabled = currentPage === 1);
            nextBtns.forEach(btn => btn.disabled = currentPage === totalPages || totalPages === 0);
            lastBtns.forEach(btn => btn.disabled = currentPage === totalPages || totalPages === 0);
        }
        
        /**
         * 更新加载状态
         */
        function updateLoadingStatus(status) {
            document.getElementById('loading-status').textContent = status;
        }
        
        /**
         * 分页控制函数
         */
        function firstPage() {
            if (currentPage !== 1) {
                currentPage = 1;
                loadCurrentPage();
            }
        }
        
        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                loadCurrentPage();
            }
        }
        
        function nextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                loadCurrentPage();
            }
        }
        
        function lastPage() {
            if (currentPage !== totalPages && totalPages > 0) {
                currentPage = totalPages;
                loadCurrentPage();
            }
        }
        
        /**
         * 改变每页显示数量
         */
        function changePageSize() {
            const newPageSize = parseInt(document.getElementById('page-size').value);
            pageSize = newPageSize;
            currentPage = 1; // 重置到第一页
            totalPages = Math.ceil(totalDevices / pageSize);
            loadCurrentPage();
        }
    </script>
</body>
</html>
